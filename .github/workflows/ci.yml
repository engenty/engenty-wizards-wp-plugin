name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - if: matrix.php == '8.3'
        run: composer install --no-progress && composer run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build
      - run: sh bin/zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: engenty-wizards
          path: engenty-wizards.zip

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: WordPress with SQLite
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --quiet
          wp config create --dbname=wp --dbuser=x --dbpass=x --skip-check --quiet
          curl -fsSL -o sqlite.zip https://downloads.wordpress.org/plugin/sqlite-database-integration.latest-stable.zip
          unzip -q sqlite.zip -d wp-content/plugins && rm sqlite.zip
          sed "s#{SQLITE_IMPLEMENTATION_FOLDER_PATH}#/tmp/wp/wp-content/plugins/sqlite-database-integration#; s#{SQLITE_PLUGIN}#sqlite-database-integration/load.php#" wp-content/plugins/sqlite-database-integration/db.copy > wp-content/db.php
          wp core install --url=http://localhost --title=Test --admin_user=admin --admin_password=admin --admin_email=a@example.com --skip-email --quiet
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/engenty-wizards
          wp plugin activate engenty-wizards
      - run: WP_PATH=/tmp/wp sh bin/smoke.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [php, build, smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engenty-wizards
      - uses: softprops/action-gh-release@v2
        with:
          files: engenty-wizards.zip
